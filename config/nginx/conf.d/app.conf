# ============================================================
# Nginx Virtual Host - PHP Application
# ============================================================

server {
    listen 1331;
    server_name _;

    # Redirect HTTP → HTTPS in production
    # return 301 https://$host$request_uri;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Deny hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Static assets with long cache ─────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Favicon / robots ──────────────────────────────────────
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    # ── PHP-FPM Status (restrict to internal) ─────────────────
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow 172.0.0.0/8;    # Docker network
        deny all;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Rate limit login endpoint ─────────────────────────────
    location ~* ^/(login|auth|api/token) {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    }

    # ── API rate limiting ─────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn_limit 20;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ── Main application ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP processing ────────────────────────────────────────
    location ~ \.php$ {
        # Security: prevent executing uploaded files as PHP
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # ── FastCGI Tuning ──────────────────────────────────────
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors on;

        # ── FastCGI Cache ───────────────────────────────────────
        fastcgi_cache php_cache;
        fastcgi_cache_valid 200 5m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $http_pragma $http_authorization;
        fastcgi_no_cache $http_pragma $http_authorization;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        add_header X-FastCGI-Cache $upstream_cache_status;
    }

    # ── Block sensitive files ─────────────────────────────────
    location ~* \.(env|log|htaccess|gitignore|lock|json)$ {
        deny all;
        return 404;
    }
}

