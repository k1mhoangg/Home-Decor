; ============================================================
; PHP-FPM Pool Configuration - Optimized for containers
; ============================================================
[www]

; ── User/Group ───────────────────────────────────────────────
user = appuser
group = appgroup

; ── Socket (faster than TCP for same-host) ──────────────────
; Use TCP since Nginx is in a different container
listen = 0.0.0.0:9000
;listen.allowed_clients = any

; ── Process Management: dynamic ─────────────────────────────
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500           ; Recycle workers to prevent memory leaks
pm.process_idle_timeout = 10s

; ── Status & Ping ────────────────────────────────────────────
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ── Logging ──────────────────────────────────────────────────

; ── Environment ──────────────────────────────────────────────
clear_env = no
catch_workers_output = yes
decorate_workers_output = no