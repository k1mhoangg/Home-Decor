; ============================================================
; PHP Custom Configuration - Production Optimized
; ============================================================

[PHP]
; ── Error Handling ──────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Performance ─────────────────────────────────────────────
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ── File Uploads ────────────────────────────────────────────
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; ── Sessions ────────────────────────────────────────────────


; ── Security ────────────────────────────────────────────────
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; ── Date ────────────────────────────────────────────────────
date.timezone = Asia/Ho_Chi_Minh

; ── Charset ─────────────────────────────────────────────────
default_charset = UTF-8

[mail function]
; Use PHPMailer / SMTP instead of sendmail
SMTP = mailpit
smtp_port = 1025