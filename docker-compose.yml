name: php-app

# ============================================================
# Docker Compose - PHP / PHP-FPM / Nginx / MySQL / PHPMailer
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # Nginx - Reverse Proxy / Web Server
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-app}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-1331}:1331"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # PHP-FPM - Application Server
  # ──────────────────────────────────────────────────────────
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - BUILDKIT_INLINE_CACHE=1
    user: "1000:1000"
    image: ${APP_NAME:-app}-php:${APP_VERSION:-latest}
    container_name: ${APP_NAME:-app}_php
    restart: unless-stopped
    environment:
      # App
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # PHPMailer / SMTP
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-""}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-""}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"My App"}
      # Redis (optional cache)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
    volumes:
      - ./src:/var/www/html
      - php_sessions:/var/lib/php/sessions
      - php_logs:/var/log/php
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    # healthcheck:
    #   test: [ "CMD-SHELL", "php-fpm -t && kill -0 1" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # MySQL - Database
  # ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ${APP_NAME:-app}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${DB_PORT_EXPOSE:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./db:/docker-entrypoint-initdb.d:ro
      - mysql_logs:/var/log/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # Redis - Cache / Session / Queue
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ${APP_NAME:-app}_redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-secret} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # Mailpit - Local SMTP testing (dev only)
  # ──────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${APP_NAME:-app}_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - backend
    profiles:
      - dev # Only starts in development: docker compose --profile dev up

# ============================================================
# Networks
# ============================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true # No external access to backend network

# ============================================================
# Volumes
# ============================================================
volumes:
  mysql_data:
    driver: local
  mysql_logs:
    driver: local
  redis_data:
    driver: local
  php_sessions:
    driver: local
  php_logs:
    driver: local
  nginx_logs:
    driver: local
